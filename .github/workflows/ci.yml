name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: install the packages
        run: flutter pub get

      - name: check the code
        run: flutter analyze

      - name: run the tests
        run: flutter test
